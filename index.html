<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  
  <!-- Markdown Parser & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background: #0b0f17; color: #e2e8f0; overflow: hidden; }

    /* Overlay for mobile drawer */
    #sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 15;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #sidebar-overlay.active { opacity: 1; pointer-events: auto; }

    /* Sidebar Drawer */
    #sidebar {
      width: 280px; background: #111625; display: flex; flex-direction: column; padding: 16px;
      transition: transform 0.3s ease; z-index: 20; border-right: 1px solid #1e293b;
      position: absolute; top: 0; bottom: 0; left: 0;
    }
    @media (min-width: 768px) {
      #sidebar { position: relative; transform: none !important; }
      #sidebar.hidden { margin-left: -280px; }
      #sidebar-overlay { display: none !important; }
    }
    #sidebar.closed { transform: translateX(-100%); }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .brand-title { font-size: 18px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }

    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600;
      color: #fff; background: #2563eb; border: none; width: 100%; transition: background 0.2s;
    }
    .new-chat-btn:hover { background: #1d4ed8; }

    .section-title { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; margin: 20px 8px 8px; letter-spacing: 0.8px; }

    /* Chat History */
    #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .chat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; color: #94a3b8; transition: all 0.2s;
    }
    .chat-item:hover { background: #1e293b; color: #f8fafc; }
    .chat-item.active { background: #1e293b; color: #38bdf8; font-weight: 600; }
    .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .delete-btn { color: #64748b; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; opacity: 0.7; }
    .delete-btn:hover { color: #f87171; background: #334155; opacity: 1; }

    /* Profile Footer */
    .user-profile {
      display: flex; align-items: center; gap: 12px; padding: 12px 8px;
      border-top: 1px solid #1e293b; margin-top: auto;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;
    }
    .user-info { display: flex; flex-direction: column; font-size: 13px; }
    .user-name { font-weight: 600; color: #fff; }
    .user-status { font-size: 11px; color: #38bdf8; font-weight: 500; }

    /* Main Container (Flex column prevents input from disappearing) */
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #0b0f17; }
    
    .top-bar { display: flex; align-items: center; padding: 12px 20px; background: #0b0f17; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
    .toggle-btn {
      background: #111625; border: 1px solid #1e293b; color: #94a3b8; cursor: pointer;
      padding: 8px 12px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .toggle-btn:hover { background: #1e293b; color: #fff; }

    /* Messages Container - Expands to fill available space and scrolls */
    #messages { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px 16px; 
      display: flex; 
      flex-direction: column;
      gap: 20px; 
      max-width: 800px; 
      width: 100%; 
      margin: 0 auto; 
      scroll-behavior: smooth;
    }
    
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; color: #64748b; margin-top: 20px;
    }
    .empty-state h2 { color: #f8fafc; font-size: 22px; margin-bottom: 8px; font-weight: 600; }
    .empty-state p { font-size: 14px; margin-bottom: 24px; }
    
    .suggestions { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; max-width: 480px; }
    @media (min-width: 500px) { .suggestions { grid-template-columns: 1fr 1fr; } }
    
    .suggestion-card {
      background: #111625; border: 1px solid #1e293b; padding: 12px 14px;
      border-radius: 12px; font-size: 13px; color: #94a3b8; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .suggestion-card:hover { border-color: #38bdf8; color: #f8fafc; background: #1e293b; }

    /* Message Formatting */
    .message-row { display: flex; gap: 12px; width: 100%; }
    .message-row.user-row { justify-content: flex-end; }
    
    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; background: #1e293b; color: #38bdf8;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; flex-shrink: 0;
    }

    .message { max-width: 88%; padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 14.5px; }
    .user { background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .bot { background: #111625; color: #e2e8f0; border: 1px solid #1e293b; border-bottom-left-radius: 4px; width: 100%; }

    /* Code Card Container */
    .code-card { background: #0b0f17; border: 1px solid #1e293b; border-radius: 10px; margin: 12px 0; overflow: hidden; }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #161b26; padding: 6px 12px; font-size: 12px; color: #94a3b8; border-bottom: 1px solid #1e293b;
    }
    .code-card pre { margin: 0; padding: 12px; overflow-x: auto; }
    .code-card code { font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 13px; }

    .copy-btn {
      background: transparent; color: #94a3b8; border: 1px solid #334155;
      padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }
    .copy-btn:hover { background: #334155; color: #fff; }

    /* Permanent Fixed Input Wrapper */
    .input-wrapper {
      flex-shrink: 0;
      padding: 16px;
      background: #0b0f17;
      border-top: 1px solid #1e293b;
      width: 100%;
    }
    #input-form {
      max-width: 800px; margin: 0 auto; display: flex; background: #111625;
      border-radius: 16px; padding: 6px 8px 6px 16px; align-items: center; border: 1px solid #1e293b;
    }
    #input-form:focus-within { border-color: #2563eb; }
    #message-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 8px 0; font-size: 15px; }
    #send-btn { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    #send-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar Drawer -->
  <aside id="sidebar" class="closed">
    <div class="sidebar-header">
      <span class="brand-title">AI Assistant</span>
    </div>

    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>

    <div class="section-title">History</div>
    <div id="chat-list"></div>

    <div class="user-profile">
      <div class="avatar">G</div>
      <div class="user-info">
        <span class="user-name">Gopal Parmar</span>
        <span class="user-status">Pro Member</span>
      </div>
    </div>
  </aside>

  <!-- Main View -->
  <main id="chat-container">
    <div class="top-bar">
      <button class="toggle-btn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="4" y1="8" x2="20" y2="8"></line>
          <line x1="4" y1="16" x2="20" y2="16"></line>
        </svg>
      </button>
    </div>

    <!-- Scrollable Message List -->
    <div id="messages"></div>

    <!-- Pinned Input Bar at Bottom -->
    <div class="input-wrapper">
      <form id="input-form" onsubmit="handleSend(event)">
        <input type="text" id="message-input" placeholder="Ask anything..." required autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    let sessions = [];
    let activeSessionId = null;

    window.onload = () => {
      const saved = localStorage.getItem('chatbot_sessions');
      if (saved) {
        try { sessions = JSON.parse(saved); } catch(e) { sessions = []; }
      }

      if (sessions.length > 0) {
        activeSessionId = sessions[0].id;
      } else {
        createNewChat();
      }
      renderSidebar();
      renderMessages();
    };

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('closed');
      sidebar.classList.toggle('hidden');
      overlay.classList.toggle('active');
    }

    function saveToLocalStorage() {
      localStorage.setItem('chatbot_sessions', JSON.stringify(sessions));
    }

    function createNewChat() {
      const current = sessions.find(s => s.id === activeSessionId);
      if (current && current.messages.length === 0) {
        renderSidebar();
        renderMessages();
        return;
      }

      const newSession = {
        id: Date.now().toString(),
        title: 'New Chat',
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      saveToLocalStorage();
      renderSidebar();
      renderMessages();
      if (window.innerWidth < 768) toggleSidebar();
    }

    function selectChat(id) {
      activeSessionId = id;
      renderSidebar();
      renderMessages();
      if (window.innerWidth < 768) toggleSidebar();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length > 0 ? sessions[0].id : null;
      }
      if (!activeSessionId) {
        createNewChat();
      } else {
        saveToLocalStorage();
        renderSidebar();
        renderMessages();
      }
    }

    function sendPresetPrompt(text) {
      document.getElementById('message-input').value = text;
      handleSend(new Event('submit'));
    }

    function renderSidebar() {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = '';

      sessions.forEach(session => {
        const div = document.createElement('div');
        div.className = `chat-item ${session.id === activeSessionId ? 'active' : ''}`;
        div.onclick = () => selectChat(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = session.title;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteChat(session.id, e);

        div.appendChild(titleSpan);
        div.appendChild(delBtn);
        listEl.appendChild(div);
      });
    }

    function copyCode(btn) {
      const card = btn.closest('.code-card');
      const codeText = card.querySelector('code').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
      });
    }

    function formatMarkdown(text) {
      const parsedHTML = marked.parse(text);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = parsedHTML;

      tempDiv.querySelectorAll('pre').forEach(pre => {
        const codeEl = pre.querySelector('code');
        const langClass = codeEl ? codeEl.className : '';
        const langMatch = langClass.match(/language-(\w+)/);
        const lang = langMatch ? langMatch[1] : 'code';

        const card = document.createElement('div');
        card.className = 'code-card';

        card.innerHTML = `
          <div class="code-header">
            <span>${lang}</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
        `;

        pre.parentNode.insertBefore(card, pre);
        card.appendChild(pre);

        if (codeEl) hljs.highlightElement(codeEl);
      });

      return tempDiv.innerHTML;
    }

    function renderMessages() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';

      const activeSession = sessions.find(s => s.id === activeSessionId);

      if (!activeSession || activeSession.messages.length === 0) {
        messagesEl.innerHTML = `
          <div class="empty-state">
            <h2>What can I help with today?</h2>
            <p>Select a quick prompt or type your query below.</p>
            <div class="suggestions">
              <div class="suggestion-card" onclick="sendPresetPrompt('Generate a creative image prompt')">🎨 Creative Image Prompt</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Explain serverless functions clearly')">⚡ Serverless Functions</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Help me brainstorm app features')">💡 Brainstorm Features</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Write a clean JavaScript async function')">📝 JavaScript Example</div>
            </div>
          </div>
        `;
        return;
      }

      activeSession.messages.forEach(msg => {
        const rowDiv = document.createElement('div');
        rowDiv.className = `message-row ${msg.role === 'user' ? 'user-row' : ''}`;

        if (msg.role === 'bot') {
          const avatar = document.createElement('div');
          avatar.className = 'msg-avatar';
          avatar.textContent = 'AI';
          rowDiv.appendChild(avatar);
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
        
        if (msg.role === 'user') {
          msgDiv.textContent = msg.content;
        } else {
          msgDiv.innerHTML = formatMarkdown(msg.content);
        }

        rowDiv.appendChild(msgDiv);
        messagesEl.appendChild(rowDiv);
      });
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();
      if (!text || !activeSessionId) return;

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      if (activeSession.title === 'New Chat') {
        activeSession.title = text.slice(0, 24) + (text.length > 24 ? '...' : '');
        renderSidebar();
      }

      activeSession.messages.push({ role: 'user', content: text });
      inputEl.value = '';
      renderMessages();

      const userRows = document.querySelectorAll('.message-row.user-row');
      const lastUserRow = userRows[userRows.length - 1];
      if (lastUserRow) {
        lastUserRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: activeSession.messages })
        });

        const data = await response.json();
        const reply = data.reply || data.message || data.content || "No response received.";

        activeSession.messages.push({ role: 'bot', content: reply });
      } catch (err) {
        console.error(err);
        activeSession.messages.push({ role: 'bot', content: 'Error connecting to server.' });
      }

      saveToLocalStorage();
      renderMessages();
    }
  </script>
</body>
</html>
