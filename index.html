<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q&A Assistant</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#4f46e5" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fafaf9;
    color: #1c1917;
  }
  .chat-container {
    max-width: 640px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid #e7e5e4;
    background: #fff;
    font-weight: 600;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mode-btn {
    font-size: 13px;
    font-weight: 500;
    background: #f4f4f3;
    border: 1px solid #e7e5e4;
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    color: #57534e;
  }
  .mode-btn.active {
    background: #4f46e5;
    color: #fff;
    border-color: #4f46e5;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #4f46e5;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #fff;
    border: 1px solid #e7e5e4;
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-bottom-left-radius: 4px;
    font-size: 13px;
    font-family: monospace;
  }
  .msg img, .msg video {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 6px;
    display: block;
  }
  .attach-preview {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: #f4f4f3;
    border-top: 1px solid #e7e5e4;
    font-size: 13px;
    color: #57534e;
  }
  .attach-preview img, .attach-preview video {
    height: 36px;
    border-radius: 6px;
  }
  .attach-preview button {
    margin-left: auto;
    background: none;
    border: none;
    color: #b91c1c;
    font-size: 13px;
    cursor: pointer;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid #e7e5e4;
    background: #fff;
    align-items: flex-end;
  }
  .chat-input-row textarea {
    flex: 1;
    resize: none;
    border: 1px solid #d6d3d1;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
  }
  .chat-input-row textarea:focus {
    outline: 2px solid #4f46e5;
    outline-offset: -1px;
  }
  .icon-btn {
    background: #f4f4f3;
    color: #57534e;
    border: 1px solid #e7e5e4;
    border-radius: 12px;
    width: 42px;
    height: 42px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .chat-input-row button.send {
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    height: 42px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .chat-input-row button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 10px 14px;
