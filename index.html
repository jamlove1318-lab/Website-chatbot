<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic AI Studio</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Markdown Parser & Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body { 
      height: 100vh; 
      height: 100dvh; 
      width: 100vw; 
      background: #121214; 
      color: #e5e5e7; 
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      overflow: hidden; 
      position: relative;
    }

    #sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 15;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      backdrop-filter: blur(2px);
    }
    #sidebar-overlay.active { opacity: 1; pointer-events: auto; }

    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 280px; background: #17171a; display: flex; flex-direction: column; padding: 20px 16px;
      z-index: 20; border-right: 1px solid #2a2a30;
      transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #sidebar.open { transform: translateX(0); }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding: 0 4px; }
    .brand-title { 
      font-family: 'Playfair Display', Georgia, serif; 
      font-size: 20px; 
      font-weight: 600; 
      color: #f0e6d2; 
      letter-spacing: 0.5px; 
    }

    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
      color: #121214; background: #d4af37; border: none; width: 100%; transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .new-chat-btn:hover { background: #e5c158; transform: translateY(-1px); }

    .section-title { 
      font-size: 11px; 
      color: #8a8a93; 
      font-weight: 600; 
      text-transform: uppercase; 
      margin: 24px 8px 10px; 
      letter-spacing: 1px; 
    }

    #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .chat-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 13.5px; color: #a1a1aa; transition: all 0.2s;
      border: 1px solid transparent;
    }
    .chat-item:hover { background: #222226; color: #f4f4f5; border-color: #2e2e35; }
    .chat-item.active { background: #24242a; color: #d4af37; font-weight: 600; border-color: #3f3a2b; }
    .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .delete-btn { color: #71717a; cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 4px; opacity: 0.6; }
    .delete-btn:hover { color: #f87171; background: #2d2323; opacity: 1; }

    #chat-container { 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      height: 100dvh; 
      width: 100%; 
      background: #121214; 
      position: relative;
    }
    
    .top-bar { display: flex; align-items: center; padding: 14px 20px; background: #121214; border-bottom: 1px solid #222226; flex-shrink: 0; }
    .toggle-btn {
      background: #1c1c20; border: 1px solid #2e2e35; color: #c4c4c8; cursor: pointer;
      padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .toggle-btn:hover { background: #27272a; color: #fff; border-color: #404048; }

    #messages { 
      flex: 1; 
      overflow-y: auto; 
      padding: 24px 16px 95px; 
      display: flex; 
      flex-direction: column; 
      gap: 24px; 
      max-width: 820px; 
      width: 100%; 
      margin: 0 auto; 
      scroll-behavior: smooth;
    }
    
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; color: #8a8a93; margin-top: 20px;
    }
    .empty-state h2 { 
      font-family: 'Playfair Display', Georgia, serif; 
      color: #f0e6d2; 
      font-size: 26px; 
      margin-bottom: 10px; 
      font-weight: 500; 
      letter-spacing: 0.3px;
    }
    .empty-state p { font-size: 14px; margin-bottom: 28px; color: #a1a1aa; }
    
    .suggestions { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 520px; }
    @media (min-width: 520px) { .suggestions { grid-template-columns: 1fr 1fr; } }
    
    .suggestion-card {
      background: #18181b; border: 1px solid #27272a; padding: 14px 16px;
      border-radius: 8px; font-size: 13px; color: #b4b4bb; text-align: left; cursor: pointer; transition: all 0.2s;
    }
    .suggestion-card:hover { border-color: #d4af37; color: #f4f4f5; background: #1f1f23; transform: translateY(-1px); }

    .message-row { display: flex; gap: 14px; width: 100%; }
    .message-row.user-row { justify-content: flex-end; }
    
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 6px; background: #27272a; color: #d4af37;
      border: 1px solid #3f3a2b;
      display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    .message { max-width: 88%; padding: 14px 18px; border-radius: 10px; line-height: 1.65; font-size: 14.5px; }
    .user { background: #d4af37; color: #121214; font-weight: 500; border-bottom-right-radius: 2px; }
    .bot { background: #18181b; color: #e4e4e7; border: 1px solid #27272a; border-bottom-left-radius: 2px; width: 100%; }

    .generated-img {
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      margin-top: 10px;
      border: 1px solid #27272a;
      display: block;
    }

    .code-card { background: #0f0f11; border: 1px solid #27272a; border-radius: 8px; margin: 14px 0; overflow: hidden; }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #18181b; padding: 8px 14px; font-size: 12px; color: #a1a1aa; border-bottom: 1px solid #27272a;
      font-family: monospace;
    }
    .code-card pre { margin: 0; padding: 14px; overflow-x: auto; }
    .code-card code { font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 13px; }

    .copy-btn {
      background: transparent; color: #a1a1aa; border: 1px solid #3f3f46;
      padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { background: #27272a; color: #f4f4f5; border-color: #52525b; }

    .input-wrapper {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 14px 16px; background: #121214; border-top: 1px solid #222226; z-index: 10;
    }
    #input-form {
      max-width: 820px; margin: 0 auto; display: flex; background: #18181b;
      border-radius: 10px; padding: 6px 8px 6px 18px; align-items: center; border: 1px solid #27272a; transition: border-color 0.2s;
    }
    #input-form:focus-within { border-color: #d4af37; }
    #message-input { flex: 1; background: transparent; border: none; outline: none; color: #f4f4f5; padding: 8px 0; font-size: 14.5px; }
    #send-btn { 
      background: #d4af37; color: #121214; border: none; padding: 8px 18px; 
      border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; 
    }
    #send-btn:hover { background: #e5c158; }
  </style>
</head>
<body>

  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">Classic AI Studio</span>
    </div>

    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Session
    </button>

    <div class="section-title">Archive</div>
    <div id="chat-list"></div>
  </aside>

  <main id="chat-container">
    <div class="top-bar">
      <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="8" x2="20" y2="8"></line>
          <line x1="4" y1="16" x2="20" y2="16"></line>
        </svg>
      </button>
    </div>

    <div id="messages"></div>

    <div class="input-wrapper">
      <form id="input-form" onsubmit="handleSend(event)">
        <input 
          type="text" 
          id="message-input" 
          placeholder="Type a message or /image a prompt..." 
          required 
          autocomplete="off"
          onfocus="closeSidebar()"
        >
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    // PASTE YOUR GROQ API KEY HERE (e.g., "gsk_...")
    const GROQ_API_KEY = "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";

    let sessions = [];
    let activeSessionId = null;

    window.onload = () => {
      const saved = localStorage.getItem('chatbot_sessions');
      if (saved) {
        try { sessions = JSON.parse(saved); } catch(e) { sessions = []; }
      }

      if (sessions.length > 0) {
        activeSessionId = sessions[0].id;
      } else {
        createNewChat();
      }
      renderSidebar();
      renderMessages();
    };

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }

    function saveToLocalStorage() {
      localStorage.setItem('chatbot_sessions', JSON.stringify(sessions));
    }

    function createNewChat() {
      const current = sessions.find(s => s.id === activeSessionId);
      if (current && current.messages.length === 0) {
        renderSidebar();
        renderMessages();
        closeSidebar();
        return;
      }

      const newSession = {
        id: Date.now().toString(),
        title: 'New Session',
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      saveToLocalStorage();
      renderSidebar();
      renderMessages();
      closeSidebar();
    }

    function selectChat(id) {
      activeSessionId = id;
      renderSidebar();
      renderMessages();
      closeSidebar();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length > 0 ? sessions[0].id : null;
      }
      if (!activeSessionId) {
        createNewChat();
      } else {
        saveToLocalStorage();
        renderSidebar();
        renderMessages();
      }
    }

    function sendPresetPrompt(text) {
      document.getElementById('message-input').value = text;
      handleSend(new Event('submit'));
    }

    function renderSidebar() {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = '';

      sessions.forEach(session => {
        const div = document.createElement('div');
        div.className = `chat-item ${session.id === activeSessionId ? 'active' : ''}`;
        div.onclick = () => selectChat(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = session.title;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteChat(session.id, e);

        div.appendChild(titleSpan);
        div.appendChild(delBtn);
        listEl.appendChild(div);
      });
    }

    function copyCode(btn) {
      const card = btn.closest('.code-card');
      const codeText = card.querySelector('code').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
      });
    }

    function formatMarkdown(text) {
      const parsedHTML = marked.parse(text);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = parsedHTML;

      tempDiv.querySelectorAll('pre').forEach(pre => {
        const codeEl = pre.querySelector('code');
        const langClass = codeEl ? codeEl.className : '';
        const langMatch = langClass.match(/language-(\w+)/);
        const lang = langMatch ? langMatch[1] : 'code';

        const card = document.createElement('div');
        card.className = 'code-card';

        card.innerHTML = `
          <div class="code-header">
            <span>${lang}</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
        `;

        pre.parentNode.insertBefore(card, pre);
        card.appendChild(pre);

        if (codeEl) hljs.highlightElement(codeEl);
      });

      return tempDiv.innerHTML;
    }

    function renderMessages() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';

      const activeSession = sessions.find(s => s.id === activeSessionId);

      if (!activeSession || activeSession.messages.length === 0) {
        messagesEl.innerHTML = `
          <div class="empty-state">
            <h2>Welcome to Classic Studio</h2>
            <p>Select a classic suggestion or type a query below.</p>
            <div class="suggestions">
              <div class="suggestion-card" onclick="sendPresetPrompt('/image an oil painting of a vintage typewriter')">🎨 Vintage Typewriter Oil Painting</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('/image a classic library with warm mahogany shelves')">📚 Mahogany Library</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Summarize key principles of elegant web design')">✨ Web Design Principles</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Write a clean JavaScript async function example')">📝 JavaScript Example</div>
            </div>
          </div>
        `;
        return;
      }

      activeSession.messages.forEach(msg => {
        const rowDiv = document.createElement('div');
        rowDiv.className = `message-row ${msg.role === 'user' ? 'user-row' : ''}`;

        if (msg.role === 'bot') {
          const avatar = document.createElement('div');
          avatar.className = 'msg-avatar';
          avatar.textContent = 'AI';
          rowDiv.appendChild(avatar);
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
        
        if (msg.role === 'user') {
          msgDiv.textContent = msg.content;
        } else {
          msgDiv.innerHTML = formatMarkdown(msg.content);
        }

        rowDiv.appendChild(msgDiv);
        messagesEl.appendChild(rowDiv);
      });
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      closeSidebar();

      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();
      if (!text || !activeSessionId) return;

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      if (activeSession.title === 'New Session') {
        activeSession.title = text.slice(0, 24) + (text.length > 24 ? '...' : '');
        renderSidebar();
      }

      activeSession.messages.push({ role: 'user', content: text });
      inputEl.value = '';

      // Image generation check
      const lowerText = text.toLowerCase();
      const isImageReq = lowerText.startsWith('/image') || 
                         lowerText.startsWith('draw') || 
                         lowerText.startsWith('generate image') || 
                         lowerText.startsWith('create image') ||
                         lowerText.startsWith('image of');

      if (isImageReq) {
        let imagePrompt = text
          .replace(/^\/image/i, '')
          .replace(/^draw an? image of/i, '')
          .replace(/^draw an?/i, '')
          .replace(/^generate an? image of/i, '')
          .replace(/^create an? image of/i, '')
          .replace(/^image of/i, '')
          .trim();

        if (!imagePrompt) imagePrompt = text;

        const encodedPrompt = encodeURIComponent(imagePrompt);
        const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${Math.floor(Math.random() * 100000)}&nologo=true`;

        const imageHTML = `Generated illustration for **"${imagePrompt}"**:\n\n<img src="${imageUrl}" alt="${imagePrompt}" class="generated-img" loading="lazy" />`;

        activeSession.messages.push({ role: 'bot', content: imageHTML });
        saveToLocalStorage();
        renderMessages();
        return;
      }

      activeSession.messages.push({ role: 'bot', content: 'Thinking...' });
      renderMessages();

      const userRows = document.querySelectorAll('.message-row.user-row');
      const lastUserRow = userRows[userRows.length - 1];
      if (lastUserRow) {
        lastUserRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      try {
        // Prepare OpenAI-compatible payload for Groq
        const formattedMessages = activeSession.messages.slice(0, -1).map(m => ({
          role: m.role === 'user' ? 'user' : 'assistant',
          content: m.content
        }));

        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: formattedMessages
          })
        });

        const data = await response.json();
        activeSession.messages.pop(); // Remove "Thinking..."

        if (data.choices && data.choices[0]?.message?.content) {
          activeSession.messages.push({ role: 'bot', content: data.choices[0].message.content });
        } else if (data.error?.message) {
          activeSession.messages.push({ role: 'bot', content: `Groq Error: ${data.error.message}` });
        } else {
          activeSession.messages.push({ role: 'bot', content: 'Unexpected response format from Groq.' });
        }
      } catch (err) {
        console.error(err);
        activeSession.messages.pop();
        activeSession.messages.push({ role: 'bot', content: 'Error connecting to Groq API. Please check your key or connection.' });
      }

      saveToLocalStorage();
      renderMessages();
    }
  </script>
</body>
</html>
