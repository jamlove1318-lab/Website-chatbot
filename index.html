<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  
  <!-- Markdown Parser & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/lib/highlight.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background: #0f1117; color: #e1e7ec; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 270px;
      background: #161822;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transition: margin-left 0.3s ease, opacity 0.2s ease;
      position: relative;
      z-index: 10;
      border-right: 1px solid #232736;
    }

    #sidebar.hidden {
      margin-left: -270px;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
    .brand-title { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      width: 100%;
      transition: background 0.2s;
    }
    .new-chat-btn:hover { background: #1d4ed8; }

    .section-title { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; margin: 20px 8px 8px 8px; letter-spacing: 0.8px; }

    /* Chat History List */
    #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      color: #94a3b8;
      transition: all 0.2s;
    }
    .chat-item:hover { background: #1e2230; color: #f1f5f9; }
    .chat-item.active { background: #1e293b; color: #38bdf8; font-weight: 600; }
    .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .delete-btn { color: #64748b; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 4px; visibility: hidden; }
    .chat-item:hover .delete-btn { visibility: visible; }
    .delete-btn:hover { color: #f87171; background: #334155; }

    /* User Profile */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-top: 1px solid #232736;
      margin-top: auto;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .user-info { display: flex; flex-direction: column; font-size: 13px; }
    .user-name { font-weight: 600; color: #fff; }
    .user-status { font-size: 11px; color: #38bdf8; font-weight: 500; }

    /* Main Container */
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #0f1117; }
    
    .top-bar { display: flex; align-items: center; padding: 12px 20px; background: #0f1117; border-bottom: 1px solid #1e2230; }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-btn:hover { background: #1e2230; color: #fff; }

    /* Message List */
    #messages { 
      flex: 1; 
      overflow-y: auto; 
      padding: 24px; 
      display: flex; 
      flex-direction: column; 
      gap: 20px; 
      max-width: 850px; 
      width: 100%; 
      margin: 0 auto; 
      scroll-behavior: smooth;
    }
    
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #64748b;
    }
    .empty-state h2 { color: #f8fafc; font-size: 24px; margin-bottom: 8px; font-weight: 600; }
    .empty-state p { font-size: 14px; margin-bottom: 24px; }
    
    .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 500px; width: 100%; }
    .suggestion-card {
      background: #161822;
      border: 1px solid #232736;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      color: #94a3b8;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .suggestion-card:hover { border-color: #38bdf8; color: #f8fafc; background: #1e2230; }

    /* Messages Formatting */
    .message { max-width: 90%; padding: 14px 18px; border-radius: 14px; line-height: 1.6; font-size: 15px; }
    .user { background: #2563eb; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: transparent; color: #e2e8f0; align-self: flex-start; width: 100%; padding-left: 0; }

    /* Custom Code Cards */
    .code-card {
      background: #161822;
      border: 1px solid #232736;
      border-radius: 12px;
      margin: 12px 0;
      overflow: hidden;
    }
    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e2230;
      padding: 8px 14px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 1px solid #232736;
    }
    .code-card pre {
      margin: 0;
      padding: 14px;
      background: #0d1117;
      overflow-x: auto;
    }
    .code-card code { font-family: "Fira Code", Consolas, Monaco, monospace; font-size: 13.5px; }

    .copy-btn {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover { background: #334155; color: #fff; }

    /* Input Box */
    .input-wrapper { padding: 20px; max-width: 850px; width: 100%; margin: 0 auto; }
    #input-form { display: flex; background: #161822; border-radius: 16px; padding: 8px 12px; align-items: center; border: 1px solid #232736; }
    #input-form:focus-within { border-color: #2563eb; }
    #message-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px; font-size: 15px; }
    #send-btn { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    #send-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">AI Assistant</span>
    </div>

    <button class="new-chat-btn" onclick="createNewChat()">
      <span>+</span> New Chat
    </button>

    <div class="section-title">History</div>
    <div id="chat-list"></div>

    <div class="user-profile">
      <div class="avatar">G</div>
      <div class="user-info">
        <span class="user-name">Gopal Parmar</span>
        <span class="user-status">Pro Member</span>
      </div>
    </div>
  </aside>

  <!-- Main View -->
  <main id="chat-container">
    <div class="top-bar">
      <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="4" y1="8" x2="20" y2="8"></line>
          <line x1="4" y1="16" x2="20" y2="16"></line>
        </svg>
      </button>
    </div>

    <div id="messages"></div>

    <div class="input-wrapper">
      <form id="input-form" onsubmit="handleSend(event)">
        <input type="text" id="message-input" placeholder="Type your message..." required autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    let sessions = [];
    let activeSessionId = null;

    window.onload = () => {
      const saved = localStorage.getItem('chatbot_sessions');
      if (saved) {
        try { sessions = JSON.parse(saved); } catch(e) { sessions = []; }
      }

      if (sessions.length > 0) {
        activeSessionId = sessions[0].id;
      } else {
        createNewChat();
      }
      renderSidebar();
      renderMessages();
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('hidden');
    }

    function saveToLocalStorage() {
      localStorage.setItem('chatbot_sessions', JSON.stringify(sessions));
    }

    function createNewChat() {
      // If current chat is already empty, just keep focused on it
      const current = sessions.find(s => s.id === activeSessionId);
      if (current && current.messages.length === 0) {
        renderSidebar();
        renderMessages();
        return;
      }

      const newSession = {
        id: Date.now().toString(),
        title: 'New Chat',
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      saveToLocalStorage();
      renderSidebar();
      renderMessages();
    }

    function selectChat(id) {
      activeSessionId = id;
      renderSidebar();
      renderMessages();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length > 0 ? sessions[0].id : null;
      }
      if (!activeSessionId) {
        createNewChat();
      } else {
        saveToLocalStorage();
        renderSidebar();
        renderMessages();
      }
    }

    function sendPresetPrompt(text) {
      document.getElementById('message-input').value = text;
      handleSend(new Event('submit'));
    }

    function renderSidebar() {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = '';

      sessions.forEach(session => {
        const div = document.createElement('div');
        div.className = `chat-item ${session.id === activeSessionId ? 'active' : ''}`;
        div.onclick = () => selectChat(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = session.title;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteChat(session.id, e);

        div.appendChild(titleSpan);
        div.appendChild(delBtn);
        listEl.appendChild(div);
      });
    }

    function copyCode(btn) {
      const card = btn.closest('.code-card');
      const codeText = card.querySelector('code').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        btn.innerText = 'Copied!';
        setTimeout(() => { btn.innerText = 'Copy'; }, 2000);
      });
    }

    function formatMarkdown(text) {
      // Configure marked parser
      const parsedHTML = marked.parse(text);
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = parsedHTML;

      // Wrap code blocks into code card containers with header and copy button
      tempDiv.querySelectorAll('pre').forEach(pre => {
        const codeEl = pre.querySelector('code');
        const langClass = codeEl ? codeEl.className : '';
        const langMatch = langClass.match(/language-(\w+)/);
        const lang = langMatch ? langMatch[1] : 'code';

        const card = document.createElement('div');
        card.className = 'code-card';

        card.innerHTML = `
          <div class="code-header">
            <span>${lang}</span>
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
          </div>
        `;

        pre.parentNode.insertBefore(card, pre);
        card.appendChild(pre);

        if (codeEl) {
          hljs.highlightElement(codeEl);
        }
      });

      return tempDiv.innerHTML;
    }

    function renderMessages() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';

      const activeSession = sessions.find(s => s.id === activeSessionId);

      if (!activeSession || activeSession.messages.length === 0) {
        messagesEl.innerHTML = `
          <div class="empty-state">
            <h2>What would you like to explore?</h2>
            <p>Ask a question or select a prompt to begin.</p>
            <div class="suggestions">
              <div class="suggestion-card" onclick="sendPresetPrompt('Generate a creative image prompt')">🎨 Generate an image prompt</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Explain how serverless functions work')">⚡ Explain serverless functions</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Help me brainstorm project ideas')">💡 Brainstorm project ideas</div>
              <div class="suggestion-card" onclick="sendPresetPrompt('Write a quick code example in JavaScript')">📝 JavaScript code example</div>
            </div>
          </div>
        `;
        return;
      }

      activeSession.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
        
        if (msg.role === 'user') {
          msgDiv.textContent = msg.content;
        } else {
          msgDiv.innerHTML = formatMarkdown(msg.content);
        }
        messagesEl.appendChild(msgDiv);
      });
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();
      if (!text || !activeSessionId) return;

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      if (activeSession.title === 'New Chat') {
        activeSession.title = text.slice(0, 24) + (text.length > 24 ? '...' : '');
        renderSidebar();
      }

      activeSession.messages.push({ role: 'user', content: text });
      inputEl.value = '';
      renderMessages();

      const userMessages = document.querySelectorAll('.message.user');
      const lastUserMsg = userMessages[userMessages.length - 1];
      if (lastUserMsg) {
        lastUserMsg.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: activeSession.messages })
        });

        const data = await response.json();
        const reply = data.reply || data.message || data.content || "No response received.";

        activeSession.messages.push({ role: 'bot', content: reply });
      } catch (err) {
        console.error(err);
        activeSession.messages.push({ role: 'bot', content: 'Error connecting to server.' });
      }

      saveToLocalStorage();
      renderMessages();
    }
  </script>
</body>
</html>
