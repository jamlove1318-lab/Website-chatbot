<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background: #131314; color: #e3e3e3; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 280px;
      background: #1e1f20;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transition: margin-left 0.3s ease, opacity 0.2s ease;
      position: relative;
      z-index: 10;
    }

    /* Collapsed Sidebar State */
    #sidebar.hidden {
      margin-left: -280px;
      opacity: 0;
      pointer-events: none;
    }

    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .brand-title { font-size: 20px; font-weight: 600; color: #fff; }

    /* Navigation / Buttons */
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      color: #c4c7c5;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
      transition: background 0.2s;
    }
    .menu-item:hover { background: #28292a; color: #fff; }

    .section-title { font-size: 12px; color: #8e918f; font-weight: 600; margin: 20px 8px 8px 8px; }

    /* Chat List */
    #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .chat-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      color: #c4c7c5;
      transition: background 0.2s;
    }
    .chat-item:hover { background: #28292a; color: #fff; }
    .chat-item.active { background: #282a2c; color: #e3e3e3; font-weight: 500; }
    .chat-item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .delete-btn { color: #8e918f; cursor: pointer; font-size: 14px; padding: 2px 6px; border-radius: 50%; visibility: hidden; }
    .chat-item:hover .delete-btn { visibility: visible; }
    .delete-btn:hover { color: #ff6b6b; background: #3c4043; }

    /* User Profile Bottom Bar */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-top: 1px solid #28292a;
      margin-top: auto;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #3367d6;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    .user-info { display: flex; flex-direction: column; font-size: 13px; }
    .user-name { font-weight: 600; color: #fff; }
    .user-status { font-size: 11px; color: #8e918f; }

    /* Main Chat Container */
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background: #131314; }
    
    /* Top Bar with Sidebar Toggle Button */
    .top-bar { display: flex; align-items: center; padding: 12px 16px; background: #131314; }
    .toggle-btn {
      background: transparent;
      border: none;
      color: #c4c7c5;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-btn:hover { background: #28292a; color: #fff; }

    /* Messages Area */
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 15px; }
    .user { background: #282a2c; color: #e3e3e3; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: transparent; color: #e3e3e3; align-self: flex-start; padding-left: 0; }

    /* Input Box */
    .input-wrapper { padding: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    #input-form { display: flex; background: #1e1f20; border-radius: 28px; padding: 8px 16px; align-items: center; border: 1px solid #28292a; }
    #message-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; padding: 10px; font-size: 15px; }
    #send-btn { background: #a8c7fa; color: #040e25; border: none; padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    #send-btn:hover { background: #c2e7ff; }
  </style>
</head>
<body>

  <!-- Sidebar Panel -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="brand-title">Gemini</span>
    </div>

    <button class="menu-item" onclick="createNewChat()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>

    <div class="section-title">Recent</div>
    <div id="chat-list"></div>

    <!-- Bottom Profile Bar -->
    <div class="user-profile">
      <div class="avatar">G</div>
      <div class="user-info">
        <span class="user-name">Gopal Parmar</span>
        <span class="user-status">PRO</span>
      </div>
    </div>
  </aside>

  <!-- Main View -->
  <main id="chat-container">
    <!-- Top bar containing the side panel toggle (2 lines) -->
    <div class="top-bar">
      <button class="toggle-btn" onclick="toggleSidebar()" title="Toggle Side Panel">
        <!-- Two horizontal lines icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="4" y1="8" x2="20" y2="8"></line>
          <line x1="4" y1="16" x2="20" y2="16"></line>
        </svg>
      </button>
    </div>

    <div id="messages"></div>

    <div class="input-wrapper">
      <form id="input-form" onsubmit="handleSend(event)">
        <input type="text" id="message-input" placeholder="Ask Gemini..." required autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </main>

  <script>
    let sessions = [];
    let activeSessionId = null;

    window.onload = () => {
      const saved = localStorage.getItem('chatbot_sessions');
      if (saved) {
        try { sessions = JSON.parse(saved); } catch(e) { sessions = []; }
      }
      
      if (sessions.length > 0) {
        activeSessionId = sessions[0].id;
      } else {
        createNewChat();
      }
      renderSidebar();
      renderMessages();
    };

    // Sidebar Toggle Function
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('hidden');
    }

    function saveToLocalStorage() {
      localStorage.setItem('chatbot_sessions', JSON.stringify(sessions));
    }

    function createNewChat() {
      const newSession = {
        id: Date.now().toString(),
        title: 'New chat',
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      saveToLocalStorage();
      renderSidebar();
      renderMessages();
    }

    function selectChat(id) {
      activeSessionId = id;
      renderSidebar();
      renderMessages();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length > 0 ? sessions[0].id : null;
      }
      if (!activeSessionId) {
        createNewChat();
      } else {
        saveToLocalStorage();
        renderSidebar();
        renderMessages();
      }
    }

    function renderSidebar() {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = '';

      sessions.forEach(session => {
        const div = document.createElement('div');
        div.className = `chat-item ${session.id === activeSessionId ? 'active' : ''}`;
        div.onclick = () => selectChat(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'title';
        titleSpan.textContent = session.title;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteChat(session.id, e);

        div.appendChild(titleSpan);
        div.appendChild(delBtn);
        listEl.appendChild(div);
      });
    }

    function renderMessages() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      activeSession.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
        msgDiv.textContent = msg.content;
        messagesEl.appendChild(msgDiv);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function handleSend(e) {
      e.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();
      if (!text || !activeSessionId) return;

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      if (activeSession.title === 'New chat') {
        activeSession.title = text.slice(0, 26);
        renderSidebar();
      }

      activeSession.messages.push({ role: 'user', content: text });
      inputEl.value = '';
      renderMessages();
      saveToLocalStorage();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: activeSession.messages })
        });

        const data = await response.json();
        const reply = data.reply || data.message || data.content || "No response received.";

        activeSession.messages.push({ role: 'bot', content: reply });
      } catch (err) {
        console.error(err);
        activeSession.messages.push({ role: 'bot', content: 'Error connecting to server.' });
      }

      saveToLocalStorage();
      renderMessages();
    }
  </script>
</body>
</html>
