<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { display: flex; height: 100vh; background: #f4f4f9; color: #333; }
    
    /* Sidebar */
    #sidebar { width: 250px; background: #1e1e2d; color: #fff; padding: 15px; display: flex; flex-direction: column; }
    #new-chat-btn { background: #007bff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
    #new-chat-btn:hover { background: #0056b3; }
    #chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 14px; color: #aaa; }
    .chat-item.active { background: #2d2d44; color: #fff; font-weight: bold; }
    .chat-item:hover { background: #2a2a3c; }
    .delete-btn { color: #ff5c5c; cursor: pointer; font-size: 12px; margin-left: 10px; }

    /* Main Chat Window */
    #chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 10px 14px; border-radius: 10px; line-height: 1.4; font-size: 15px; }
    .user { background: #007bff; color: white; align-self: flex-end; }
    .bot { background: #e5e5ea; color: black; align-self: flex-start; }
    
    /* Form */
    #input-form { display: flex; padding: 15px; background: #fff; border-top: 1px solid #ddd; }
    #message-input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; }
    #send-btn { background: #007bff; color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <button id="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
    <div id="chat-list"></div>
  </div>

  <!-- Chat Area -->
  <div id="chat-container">
    <div id="messages"></div>
    <form id="input-form" onsubmit="handleSend(event)">
      <input type="text" id="message-input" placeholder="Type a message..." required autocomplete="off">
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>

  <script>
    let sessions = [];
    let activeSessionId = null;

    // Load saved data from localStorage on startup
    window.onload = () => {
      const saved = localStorage.getItem('chatbot_sessions');
      if (saved) {
        try { sessions = JSON.parse(saved); } catch(e) { sessions = []; }
      }
      
      if (sessions.length > 0) {
        activeSessionId = sessions[0].id;
      } else {
        createNewChat();
      }
      renderSidebar();
      renderMessages();
    };

    function saveToLocalStorage() {
      localStorage.setItem('chatbot_sessions', JSON.stringify(sessions));
    }

    function createNewChat() {
      const newSession = {
        id: Date.now().toString(),
        title: 'New Chat',
        messages: []
      };
      sessions.unshift(newSession);
      activeSessionId = newSession.id;
      saveToLocalStorage();
      renderSidebar();
      renderMessages();
    }

    function selectChat(id) {
      activeSessionId = id;
      renderSidebar();
      renderMessages();
    }

    function deleteChat(id, event) {
      event.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (activeSessionId === id) {
        activeSessionId = sessions.length > 0 ? sessions[0].id : null;
      }
      if (!activeSessionId) {
        createNewChat();
      } else {
        saveToLocalStorage();
        renderSidebar();
        renderMessages();
      }
    }

    function renderSidebar() {
      const listEl = document.getElementById('chat-list');
      listEl.innerHTML = '';

      sessions.forEach(session => {
        const div = document.createElement('div');
        div.className = `chat-item ${session.id === activeSessionId ? 'active' : ''}`;
        div.onclick = () => selectChat(session.id);

        const titleSpan = document.createElement('span');
        titleSpan.textContent = session.title;
        titleSpan.style.overflow = 'hidden';
        titleSpan.style.textOverflow = 'ellipsis';
        titleSpan.style.whiteSpace = 'nowrap';

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.onclick = (e) => deleteChat(session.id, e);

        div.appendChild(titleSpan);
        div.appendChild(delBtn);
        listEl.appendChild(div);
      });
    }

    function renderMessages() {
      const messagesEl = document.getElementById('messages');
      messagesEl.innerHTML = '';

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      activeSession.messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role === 'user' ? 'user' : 'bot'}`;
        msgDiv.textContent = msg.content;
        messagesEl.appendChild(msgDiv);
      });

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function handleSend(e) {
      e.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();
      if (!text || !activeSessionId) return;

      const activeSession = sessions.find(s => s.id === activeSessionId);
      if (!activeSession) return;

      // Update session title if first message
      if (activeSession.title === 'New Chat') {
        activeSession.title = text.slice(0, 20) + (text.length > 20 ? '...' : '');
        renderSidebar();
      }

      // Add user message
      activeSession.messages.push({ role: 'user', content: text });
      inputEl.value = '';
      renderMessages();
      saveToLocalStorage();

      try {
        // Call your backend API endpoint inside the /api folder
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: activeSession.messages })
        });

        const data = await response.json();
        const reply = data.reply || data.message || data.content || "No response received.";

        activeSession.messages.push({ role: 'bot', content: reply });
      } catch (err) {
        console.error(err);
        activeSession.messages.push({ role: 'bot', content: 'Error connecting to API.' });
      }

      saveToLocalStorage();
      renderMessages();
    }
  </script>
</body>
</html>
